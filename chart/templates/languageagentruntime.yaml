apiVersion: langop.io/v1alpha1
kind: LanguageAgentRuntime
metadata:
  name: opencode
  labels:
    {{- include "opencode.labels" . | nindent 4 }}
spec:
  # Built on coding-runtime, which owns the OS layer, the web terminal and the
  # /etc/agent/config.yaml ETL. This repo adds the opencode CLI plus a manifest
  # (/etc/coding-runtime/runtime.json), an emitter and a launcher.
  image: {{ .Values.image.repository }}:{{ .Values.image.tag }}

  # Authentication is handled entirely by the cluster OIDC proxy — this is the
  # sole auth gate. When the cluster enables auth, agents using this runtime sit
  # behind the injected oauth2-proxy sidecar. opencode talks to the model gateway
  # using the provider config in opencode.jsonc; no interactive login is needed.
  auth:
    enabled: {{ .Values.auth.enabled }}

  ports:
    - name: http
      port: {{ .Values.port }}
      protocol: TCP
      expose: true

  deployment:
    {{- if .Values.image.pullPolicy }}
    imagePullPolicy: {{ .Values.image.pullPolicy }}
    {{- end }}
    # The container runs the base entrypoint: resolve the environment, seed
    # config, then serve. Seeding runs here rather than in an init container
    # because the operator mounts /tmp into the agent container only, so an init
    # container shares no writable path with it — and the normalized config is a
    # pure function of /etc/agent/config.yaml plus the environment, both of which
    # are already present here. On WebSocket connect the base spawns
    # `tmux new-session -A` running launch-opencode, in AGENT_REPO_DIR when the
    # agent sets spec.repository and /workspace otherwise.
    #
    # HOME, the XDG directories and OPENCODE_CONFIG_DIR are all computed by the
    # base (the last from runtime.json), so none of them are set here.

    # Probe the harness, not just the listener: a TCP probe stays green against a
    # socket with a dead harness behind it. Not /ping or /ready — oauth2-proxy
    # v7.6.0 answers both itself, before the upstream ever sees them.
    startupProbe:
      httpGet:
        path: /healthz
        port: {{ .Values.port }}
      initialDelaySeconds: 5
      periodSeconds: 2
      timeoutSeconds: 2
      failureThreshold: 30

    livenessProbe:
      httpGet:
        path: /healthz
        port: {{ .Values.port }}
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 3

    readinessProbe:
      httpGet:
        path: /readyz
        port: {{ .Values.port }}
      periodSeconds: 10
      timeoutSeconds: 3
      successThreshold: 1
      failureThreshold: 3

    env:
      # The port the terminal server binds. Without this the server would fall
      # back to its own default and .Values.port would only move the Service.
      - name: PORT
        value: {{ .Values.port | quote }}

    resources:
      {{- toYaml .Values.resources | nindent 6 }}
