# opencode LanguageAgentRuntime — a cluster-scoped runtime preset.
# Requires the language-operator chart (which provides the LanguageAgentRuntime
# CRD) to be installed first.

# Runtime image built by this repo: the coding-runtime base plus the opencode
# CLI, a manifest, an emitter and a launcher. One container — the base seeds
# opencode's config from /etc/agent/config.yaml on start, then serves the
# xterm.js / tmux WebSocket terminal that fronts the interactive TUI.
image:
  repository: ghcr.io/language-operator/opencode-adapter
  tag: 0.1.7
  pullPolicy: ""

# Agents using this runtime sit behind the cluster OIDC proxy (when the cluster
# enables auth).
auth:
  enabled: true

# HTTP port the WebSocket terminal server listens on. Injected as PORT, so it
# moves the listener and the Service together.
port: 8080

resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 2Gi
    cpu: 1000m
